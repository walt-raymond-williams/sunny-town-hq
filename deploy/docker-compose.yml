services:
  postgres:
    image: postgres:16-alpine
    container_name: hq-postgres
    environment:
      POSTGRES_DB: hq
      POSTGRES_USER: hq
      POSTGRES_PASSWORD: hq
    ports:
      - "55432:5432"
    volumes:
      - hq-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hq -d hq"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak-postgres:
    image: postgres:16-alpine
    container_name: hq-keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - hq-keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: hq-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "18081:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy

  sunny-town:
    build:
      context: ..
      dockerfile: deploy/sunny-town/Dockerfile
    container_name: hq-sunny-town
    environment:
      SUNNY_TOWN_PORT: "18082"
      SUNNY_TOWN_JOIN_SECRET: local-dev-secret
      SUNNY_TOWN_SERVICE_SECRET: local-dev-service-secret
      HQ_INTERNAL_BASE_URL: http://host.docker.internal:8080
      SUNNY_TOWN_ALLOWED_ORIGINS: "*"
    ports:
      - "18082:18082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18082/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hq-postgres-data:
  hq-keycloak-postgres-data:
