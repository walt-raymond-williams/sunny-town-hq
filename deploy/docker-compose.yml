services:
  postgres:
    image: postgres:16-alpine
    container_name: hq-postgres
    environment:
      POSTGRES_DB: hq
      POSTGRES_USER: hq
      POSTGRES_PASSWORD: hq
    ports:
      - "55432:5432"
    volumes:
      - hq-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hq -d hq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hq-postgres-data:
